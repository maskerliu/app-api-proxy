productName: AppApiProxy
appId: com.github.maskerliu.AppApiProxy
directories:
  output: build/${version}

asarUnpack:
  - "node_modules/leveldown/**/*"

publish:
  - provider: "generic"
    url: ""

files:
  - "dist/**/*"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/node_modules/*/{LICENSE,README,readme,.eslintignore,.nycrc,COPYING,UNLICENSE,LICENSE-MIT}"
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/*.md"
  - "!**/node_modules/**/*.markdown"
  - "!**/node_modules/**/*.ts"
  - "!**/node_modules/**/build/**/*"
  - "!**/node_modules/**/bin/**"
  - "!**/node_modules/**/bench/**"
  - "!**/node_modules/**/test/**"
  - "!**/node_modules/**/tests/**"
  - "!**/node_modules/**/*test.js"
  - "**/node_modules/**/chunking-test.js"
  - "!**/node_modules/**/doc/**"
  - "!**/node_modules/**/docs/**"
  - "!**/node_modules/**/example/**"
  - "!**/node_modules/**/examples/**"
  - "!**/node_modules/**/.github/**"
  - "!**/node_modules/**/deps/**"
  - "!**/node_modules/**/prebuilds/**"
  - "**/node_modules/**/prebuilds/${platform}-${arch}/**/*"
  - "!**/node_modules/**/src/**"
  - "!**/node_modules/**/browser/**"
  - "!**/node_modules/**/umd/**"
  - "!**/node_modules/**/esm/**"
  - "!**/node_modules/**/esm-*/**"
  - "!**/node_modules/**/*browser*"
  - "!**/node_modules/**/tsconfig.json"
  # 主进程为 CJS，排除无用的 ESM/UMD/test 构建变体
  - "!**/node_modules/**/lib/index.es.js"
  - "!**/node_modules/psl/dist/psl.mjs"
  - "!**/node_modules/psl/dist/psl.umd.cjs"
  - "!**/node_modules/node-fetch/lib/index.mjs"
  - "!**/node_modules/bignumber.js/bignumber.mjs"
  - "!**/node_modules/**/tests.js"
  - "!**/node_modules/qs/dist/**"
  # 注意：inversify 7 内部会 require('reflect-metadata/lite')，ReflectLite.js 不能排除
  - "!**/node_modules/**/*.min.js"
  - "**/node_modules/debug/src/**"
  - "**/node_modules/**/cuid2/src/**"

electronLanguages:
  - en-US
  - zh-CN


win:
  icon: icons/icon.ico
  compression: "maximum"
  extraFiles:
    - from: "./update.ps1"
      to: "./resources/"
    - from: "./update-helper.cjs"
      to: "./resources/"
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: false
  allowToChangeInstallationDirectory: false
  uninstallDisplayName: ${productName}
  installerIcon: windows_installer.ico
  installerHeaderIcon: windows_installer.ico
  installerHeader: windows_installer_header.bmp
  installerSidebar: sidebar.bmp

mac:
  icon: icons/icon.icns
  extraFiles:
    - from: "./update.sh"
      to: "./resources/"
  target:
    - target: dmg
      arch: universal
    # 全量更新（autoUpdater）依赖 zip 产物与 latest-mac.yml
    - target: zip
      arch: universal

pkg:
  installLocation: /Applications

linux:
  icon: icons/icon.png
  category: "Utils"
  extraFiles:
    - from: "./update.sh"
      to: "./resources/"
  target:
    - target: appImage
